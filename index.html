<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAYPER Streetwear Egypt</title>
    <style>
        :root {
            --bg-color: #0D0D0D;
            --card-bg: #181818;
            --accent: #D4C3A3;
            --text-main: #FFFFFF;
            --text-muted: #A0A0A0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }
        header { background: #000; border-bottom: 1px solid #222; padding: 20px; text-align: center; }
        header h1 { color: var(--accent); font-size: 24px; letter-spacing: 2px; }
        header p { color: var(--text-muted); font-size: 13px; margin-top: 5px; }
        .hero { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1509967419530-da38b4704bc6?auto=format&fit=crop&w=1800&q=85') center/cover; padding: 60px 20px; text-align: center; }
        .hero h2 { color: #fff; font-size: 28px; margin-bottom: 10px; }
        .hero p { color: var(--accent); font-size: 14px; margin-bottom: 20px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
        .section-title { font-size: 20px; color: var(--accent); margin-bottom: 20px; border-right: 4px solid var(--accent); padding-right: 10px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .product-card { background: var(--card-bg); border-radius: 8px; overflow: hidden; border: 1px solid #252525; transition: transform 0.3s; }
        .product-card:hover { transform: translateY(-5px); }
        .product-card img { width: 100%; height: 320px; object-fit: cover; }
        .product-info { padding: 15px; }
        .product-title { font-size: 15px; font-weight: bold; margin-bottom: 8px; color: #fff; height: 40px; overflow: hidden; }
        .product-price { color: var(--accent); font-size: 16px; font-weight: bold; margin-bottom: 12px; }
        .product-price span { color: var(--text-muted); text-decoration: line-through; font-size: 13px; margin-right: 8px; }
        .btn { display: block; width: 100%; background: var(--accent); color: #000; padding: 10px; text-align: center; text-decoration: none; font-weight: bold; border-radius: 4px; transition: background 0.2s; }
        .btn:hover { background: #bfa882; }
        footer { text-align: center; padding: 30px; color: var(--text-muted); font-size: 13px; border-top: 1px solid #222; margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <h1 id="store-title">KAYPER</h1>
        <p>EGYPTIAN LUXURY STREETWEAR</p>
    </header>

    <div class="hero">
        <h2>فخامة الشارع. أصالة القاهرة.</h2>
        <p>أقمشة قطنية ثقيلة، قصات أوفرسايز معمارية، وحرفية مصرية استثنائية.</p>
    </div>

    <div class="container">
        <div class="section-title">أحدث المنتجات</div>
        <div class="products-grid" id="products-container">
            <p style="color: #a0a0a0; text-align: center; grid-column: 1/-1;">جاري تحميل المنتجات...</p>
        </div>
    </div>

    <footer>
        <p>© 2026 KAYPER Streetwear Egypt. All Rights Reserved.</p>
    </footer>

    <script>
        // سحب البيانات تلقائياً من ملف store_data.json الخاص بك
        fetch('store_data.json')
            .then(response => response.json())
            .then(data => {
                if (data.store) {
                    document.getElementById('store-title').innerText = data.store;
                }
                const container = document.getElementById('products-container');
                if (data.products && data.products.length > 0) {
                    container.innerHTML = '';
                    data.products.forEach(prod => {
                        let imgUrl = (prod.images && prod.images.length > 0) ? prod.images[0] : 'https://images.unsplash.com/photo-1509967419530-da38b4704bc6';
                        container.innerHTML += `
                            <div class="product-card">
                                <img src="${imgUrl}" alt="${prod.nameAr}">
                                <div class="product-info">
                                    <div class="product-title">${prod.nameAr}</div>
                                    <div class="product-price"><span>${prod.comparePrice} ج.م</span> ${prod.price} ج.م</div>
                                    <a href="https://wa.me/201001234567?text=${encodeURIComponent('أريد طلب: ' + prod.nameAr + ' بسعر ' + prod.price + ' ج.م')}" target="_blank" class="btn">اطلب عبر الواتساب</a>
                                </div>
                            </div>
                        `;
                    });
                }
            })
            .catch(error => {
                console.error('Error loading store data:', error);
            });
    </script>
</body>
</html>
